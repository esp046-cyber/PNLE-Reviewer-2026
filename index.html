<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PNLE Reviewer 2026</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: white; padding: 20px; max-width: 600px; margin: auto; }
    h2 { color: #38bdf8; text-align: center; }
    .score-board { text-align: right; font-weight: bold; color: #94a3b8; margin-bottom: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .np-badge { display: inline-block; background: #334155; padding: 4px 10px; border-radius: 20px; font-size: 12px; color: #cbd5e1; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;}
    .option { display: block; background: #334155; padding: 15px; margin: 12px 0; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
    .option:active { transform: scale(0.98); }
    .correct { background: #064e3b !important; border-color: #10b981 !important; }
    .wrong { background: #7f1d1d !important; border-color: #ef4444 !important; }
    .rationale { margin-top: 20px; padding: 15px; background: #0c4a6e; border-left: 4px solid #0ea5e9; border-radius: 4px; display: none; line-height: 1.5; }
    .next-btn { background: #0ea5e9; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 20px; display: none; }
  </style>
</head>
<body>

  <h2>PNLE 2026 Simulator</h2>
  <div class="score-board">Score: <span id="score">0</span> / <span id="total">0</span></div>

  <div class="card" id="quiz-container">
    <div class="np-badge" id="np-badge">Loading...</div>
    <h3 id="question-text" style="line-height: 1.4; margin-top: 0;">Loading your questions...</h3>
    <div id="options"></div>
    <div id="rationale" class="rationale"></div>
    <button id="next-btn" class="next-btn">Next Question →</button>
  </div>

  <script>
    let questions = [];
    let currentIndex = 0;
    let score = 0;

    // This fetches the question.json file you already uploaded to GitHub
    fetch('question.json')
      .then(response => response.json())
      .then(data => {
        questions = data;
        document.getElementById('total').innerText = questions.length;
        loadQuestion();
      })
      .catch(error => {
        document.getElementById('question-text').innerText = "Error: Could not load question.json. Make sure your JSON format is strictly correct.";
        document.getElementById('np-badge').style.display = 'none';
      });

    function loadQuestion() {
      if (currentIndex >= questions.length) {
        document.getElementById('quiz-container').innerHTML = `<h2 style="text-align:center;">Exam Complete!</h2><p style="text-align:center; font-size: 20px;">Final Score: <strong>${score} / ${questions.length}</strong></p>`;
        return;
      }

      const q = questions[currentIndex];
      document.getElementById('np-badge').innerText = q.np;
      document.getElementById('question-text').innerText = `${q.id}. ${q.question}`;
      
      const optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = '';
      document.getElementById('rationale').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';

      for (const [key, value] of Object.entries(q.options)) {
        const btn = document.createElement('div');
        btn.className = 'option';
        btn.innerText = `${key}. ${value}`;
        btn.onclick = () => checkAnswer(key, q.answer, q.rationale, btn);
        optionsDiv.appendChild(btn);
      }
    }

    function checkAnswer(selected, correct, rationaleText, element) {
      const options = document.querySelectorAll('.option');
      options.forEach(opt => opt.onclick = null); // Disable clicking other answers

      if (selected === correct) {
        element.classList.add('correct');
        score++;
        document.getElementById('score').innerText = score;
      } else {
        element.classList.add('wrong');
        // Auto-highlight the correct answer
        options.forEach(opt => {
          if (opt.innerText.startsWith(correct)) opt.classList.add('correct');
        });
      }

      const rationaleDiv = document.getElementById('rationale');
      rationaleDiv.innerHTML = `<strong>Rationale:</strong><br>${rationaleText}`;
      rationaleDiv.style.display = 'block';
      
      const nextBtn = document.getElementById('next-btn');
      nextBtn.style.display = 'block';
      nextBtn.onclick = () => {
        currentIndex++;
        loadQuestion();
      };
    }
  </script>

</body>
</html>
